<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corporate Slavery Simulator</title>
  <style>
    /* 90's pixelated digital style */
    body {
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: #0f0;
      margin: 0;
      padding: 20px;
      width: 250px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 4px solid #0f0;
      box-sizing: border-box;
    }

    h1 {
      font-size: 12px;
      text-align: center;
      margin: 0;
      margin-bottom: 10px;
      text-shadow: 1px 1px #0ff;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 15px;
      margin: 5px;
      border: 2px solid #0f0;
      background: #000;
      color: #0f0;
      cursor: pointer;
      text-shadow: 1px 1px #0ff;
      transition: all 0.1s;
    }

    button:hover {
      background: #0f0;
      color: #000;
      text-shadow: none;
    }

    #status {
      font-size: 8px;
      margin-top: 10px;
      color: #ff0;
      text-align: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  </style>
</head>
<body>
    <div class="flex gap-0">
        <h1>Corporate Slavery Simulator</h1>
        <h1>By Fauz</h1>
    </div>
  <div>
    <button id="startBtn">START</button>
    <button id="stopBtn">STOP</button>
  </div>
  <div id="status">STATUS: STOPPED</div>

  <script src="popup.js"></script>
</body>
</html>
